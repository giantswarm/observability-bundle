resources:
  - groupVersionKind:
      group: gateway.envoyproxy.io
      kind: "EnvoyProxy"
      version: "v1alpha1"
    metricNamePrefix: envoygateway_envoyproxy
    labelsFromPath:
      name:
        - metadata
        - name
      namespace:
        - metadata
        - namespace
    metrics:
      - name: "info"
        help: "EnvoyProxy information"
        each:
          type: Info
          info:
            labelsFromPath:
              merge_gateways: [spec, mergeGateways]
      - name: "created"
        help: "created timestamp"
        each:
          type: Gauge
          gauge:
            path: [metadata, creationTimestamp]
      - name: "deleted"
        help: "deletion timestamp"
        each:
          type: Gauge
          gauge:
            path: [metadata, deletionTimestamp]
            nilIsZero: true
  - groupVersionKind:
      group: gateway.envoyproxy.io
      kind: "SecurityPolicy"
      version: "v1alpha1"
    metricNamePrefix: envoygateway_securitypolicy
    labelsFromPath:
      name:
        - metadata
        - name
      namespace:
        - metadata
        - namespace
    metrics:
      - name: "info"
        help: "SecurityPolicy information"
        each:
          type: Info
          info:
            labelsFromPath:
              target_kind: [spec, targetRef, kind]
              target_name: [spec, targetRef, name]
      - name: "target_info"
        help: "Resources the SecurityPolicy is attached to via spec.targetRefs. The deprecated spec.targetRef is in the info metric, spec.targetSelectors is not covered"
        each:
          type: Info
          info:
            path: [spec, targetRefs]
            labelsFromPath:
              target_group: ["group"]
              target_kind: ["kind"]
              target_name: ["name"]
              target_section_name: ["sectionName"]
      - name: "status_ancestor_accepted"
        help: "Accepted condition of the SecurityPolicy, per ancestor it is attached to. 1 when True, 0 when False or Unknown, no series when the policy resolved no ancestor"
        each:
          type: Gauge
          gauge:
            path: [status, ancestors]
            valueFrom: ["conditions", "[type=Accepted]", "status"]
            labelsFromPath:
              controller_name: ["controllerName"]
              ancestor_group: ["ancestorRef", "group"]
              ancestor_kind: ["ancestorRef", "kind"]
              ancestor_name: ["ancestorRef", "name"]
              ancestor_namespace: ["ancestorRef", "namespace"]
              ancestor_section_name: ["ancestorRef", "sectionName"]
              ancestor_port: ["ancestorRef", "port"]
              reason: ["conditions", "[type=Accepted]", "reason"]
      - name: "created"
        help: "created timestamp"
        each:
          type: Gauge
          gauge:
            path: [metadata, creationTimestamp]
      - name: "deleted"
        help: "deletion timestamp"
        each:
          type: Gauge
          gauge:
            path: [metadata, deletionTimestamp]
            nilIsZero: true
